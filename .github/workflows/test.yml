name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3
        
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build PDF worker
      run: npm run build:worker
      
    - name: Run tests
      run: npm test
      
    - name: Run linting
      run: npm run lint

    # Package locally without credentials. This does not create resources or
    # publish a Worker; deployment remains a separately authorised operation.
    - name: Build Cloudflare Worker
      run: npm run build:cloudflare

    - name: Validate Cloudflare package
      run: npx wrangler deploy --dry-run --outdir /tmp/bamboobot-worker
